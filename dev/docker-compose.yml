# A development panel for previewing the theme: Pterodactyl 2.0 built from ../.panel, its database
# and cache, and a mock Wings daemon that serves fixed server data. See dev/README.md.
name: basalt-dev

x-panel-environment: &panel-environment
  APP_URL: "http://localhost:8080"
  APP_TIMEZONE: "UTC"
  APP_SERVICE_AUTHOR: "dev@example.com"
  APP_ENV: "production"
  APP_DEBUG: "true"
  # Read the admin area's settings (panel name, locale) from the database, as an installed panel does.
  APP_ENVIRONMENT_ONLY: "false"
  DB_HOST: "database"
  DB_PORT: "3306"
  DB_DATABASE: "panel"
  DB_USERNAME: "pterodactyl"
  DB_PASSWORD: "development"
  CACHE_STORE: "redis"
  SESSION_DRIVER: "redis"
  SESSION_CONNECTION: "sessions"
  QUEUE_CONNECTION: "redis"
  REDIS_HOST: "cache"
  MAIL_MAILER: "log"
  MAIL_FROM_ADDRESS: "noreply@example.com"
  QUEUE_WORKER_ENABLED: "true"
  SCHEDULER_ENABLED: "false"
  # The stock site key challenges automated browsers; a local panel does not need it.
  RECAPTCHA_ENABLED: "false"

services:
  database:
    image: mariadb:11.4
    environment:
      MARIADB_PASSWORD: "development"
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: "panel"
      MARIADB_USER: "pterodactyl"
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  cache:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  panel:
    image: ${PANEL_IMAGE:-ptero-panel:dev}
    ports:
      - "8080:80"
      # The mock Wings shares this container's network, so "localhost:8443" is the node to the
      # panel and to the browser alike.
      - "8443:8443"
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    volumes:
      - panel-var:/app/var
      - panel-extensions:/app/extensions
      - panel-extension-assets:/app/public/assets/extensions
      - ../basalt:/src/basalt
      - ./seed:/seed:ro
    environment: *panel-environment

  wings:
    image: node:22-alpine
    working_dir: /wings
    command: ["sh", "-c", "npm install --no-audit --no-fund --silent && exec node server.mjs"]
    network_mode: "service:panel"
    depends_on:
      - panel
    volumes:
      - ./wings:/wings

volumes:
  database:
  panel-var:
  panel-extensions:
  panel-extension-assets:
